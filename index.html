<script>
/* =====================================================================
   WCC bracket live wiring — JT (#27, Pacific) tournament running totals
   Refactored for concurrency, DOM caching, and streamlined state logic.
   ===================================================================== */
(function(){
  const PLAYER_NAME_MATCH = /\bshank\b/i;
  const PLAYER_LABEL = "J. Shank";
  const TEAM_NAME_MATCH = /pacific/i;
  const TOURNAMENT_DATES = ["20260519","20260520","20260521","20260522","20260523","20260524","20260525"];
  
  const SCOREBOARD_VARIANTS = (date) => [
    `https://site.api.espn.com/apis/site/v2/sports/baseball/college-baseball/scoreboard?dates=${date}&groups=27&limit=300`,
    `https://site.api.espn.com/apis/site/v2/sports/baseball/college-baseball/scoreboard?dates=${date}&groups=50&limit=300`,
    `https://site.api.espn.com/apis/site/v2/sports/baseball/college-baseball/scoreboard?dates=${date}&limit=300`
  ];
  const SUMMARY = (eid) => `https://site.web.api.espn.com/apis/site/v2/sports/baseball/college-baseball/summary?event=${eid}`;
  const POLL_LIVE_MS  = 60_000;
  const POLL_IDLE_MS  = 5 * 60_000;

  // Cached DOM Elements (Prevents DOM thrashing on every tick)
  const DOM = {
    log: document.getElementById("dbgLog"),
    sync: document.getElementById("lastSync"),
    liveDot: document.getElementById("liveDot"),
    gpLabel: document.getElementById("gpLabel"),
    bracketCards: Array.from(document.querySelectorAll(".game[data-teams]")),
    statCards: document.querySelectorAll(".stat"),
    stats: {
      avg: { val: document.getElementById("val-avg"), sub: document.getElementById("sub-avg"), card: document.getElementById("card-avg") },
      r:   { val: document.getElementById("val-r"),   card: document.getElementById("card-r") },
      rbi: { val: document.getElementById("val-rbi"), card: document.getElementById("card-rbi") },
      hr:  { val: document.getElementById("val-hr"),  card: document.getElementById("card-hr") },
      obp: { val: document.getElementById("val-obp"), card: document.getElementById("card-obp") },
      ops: { val: document.getElementById("val-ops"), card: document.getElementById("card-ops") }
    },
    manual: {
      opp: document.getElementById("me-opp"), ab: document.getElementById("me-ab"), h: document.getElementById("me-h"),
      r: document.getElementById("me-r"), rbi: document.getElementById("me-rbi"), hr: document.getElementById("me-hr"),
      d2: document.getElementById("me-2b"), d3: document.getElementById("me-3b"), bb: document.getElementById("me-bb"),
      hbp: document.getElementById("me-hbp"), sf: document.getElementById("me-sf"), save: document.getElementById("me-save"),
      clear: document.getElementById("me-clear"), resync: document.getElementById("me-resync")
    }
  };

  // Storage
  const store = (() => {
    try {
      const k = "__test__";
      localStorage.setItem(k, "1"); localStorage.removeItem(k);
      return {
        get: async (key) => ({ value: localStorage.getItem(key) }),
        set: async (key, val) => { localStorage.setItem(key, val); return true; }
      };
    } catch(e) { return null; }
  })();
  let games = {};

  // Logging
  const dbg = [];
  function log(line){
    const ts = new Date().toLocaleTimeString([], {hour12:false});
    dbg.push(`[${ts}] ${line}`);
    if (dbg.length > 80) dbg.shift();
    if (DOM.log) DOM.log.textContent = dbg.join("\n");
  }

  const fmt3 = (n) => {
    if (!isFinite(n)) return "---";
    const s = n.toFixed(3);
    return n < 1 && n >= 0 ? s.slice(1) : s;
  };

  const setSync = (msg, cls) => {
    if (!DOM.sync) return;
    DOM.sync.textContent = msg;
    DOM.sync.className = "sync " + (cls || "");
  };

  async function loadGames(){
    if (!store) return;
    try {
      const r = await store.get("jt27_games");
      if (r && r.value) games = JSON.parse(r.value);
    } catch(e){}
  }

  async function saveGames(){
    if (store) try { await store.set("jt27_games", JSON.stringify(games)); } catch(e){}
  }

  // Calculate & Render
  function render(){
    const totals = Object.values(games).reduce((a, g) => {
      ["ab","h","r","rbi","hr","bb","hbp","sf","tb"].forEach(k => a[k] = (a[k]||0) + (g[k]||0));
      return a;
    }, {});

    const ab = totals.ab || 0, h = totals.h || 0, bb = totals.bb || 0, hbp = totals.hbp || 0, sf = totals.sf || 0, tb = totals.tb || 0;
    const avg = ab > 0 ? h / ab : NaN;
    const obpDen = ab + bb + hbp + sf;
    const obp = obpDen > 0 ? (h + bb + hbp) / obpDen : NaN;
    const slg = ab > 0 ? tb / ab : NaN;
    const ops = (isFinite(obp) && isFinite(slg)) ? (obp + slg) : NaN;

    DOM.stats.avg.val.textContent = fmt3(avg);
    DOM.stats.avg.sub.textContent = `${h} for ${ab}`;
    DOM.stats.r.val.textContent = totals.r || 0;
    DOM.stats.rbi.val.textContent = totals.rbi || 0;
    DOM.stats.hr.val.textContent = totals.hr || 0;
    DOM.stats.obp.val.textContent = fmt3(obp);
    DOM.stats.ops.val.textContent = fmt3(ops);

    const filled = ab > 0 ? "true" : "false";
    Object.values(DOM.stats).forEach(stat => stat.card.setAttribute("data-filled", filled));

    DOM.gpLabel.textContent = Object.values(games).filter(g => (g.ab||0) + (g.bb||0) + (g.hbp||0) > 0).length;
  }

  // Network Fetching w/ Sequential Fallback
  async function getJSON(url){
    const tries = [
      { label: "espn", u: url },
      { label: "corsproxy.io", u: `https://corsproxy.io/?${encodeURIComponent(url)}` },
      { label: "allorigins", u: `https://api.allorigins.win/raw?url=${encodeURIComponent(url)}` }
    ];
    let lastErr;
    for (const t of tries){
      try {
        const r = await fetch(t.u, { mode: "cors" });
        if (!r.ok) { lastErr = new Error(`HTTP ${r.status} via ${t.label}`); continue; }
        return await r.json();
      } catch(e){ lastErr = new Error(`${t.label}: ${e.message||e}`); }
    }
    throw lastErr || new Error("all fetches failed");
  }

  const WCC_TEAMS = ["pacific","san francisco","saint mary's","saint marys","gonzaga","pepperdine","santa clara"];
  const isWccTeam = (name) => WCC_TEAMS.some(t => name.toLowerCase().includes(t));

  async function findWccEventsForDate(date) {
    const variants = SCOREBOARD_VARIANTS(date);
    for (let i = 0; i < variants.length; i++){
      try {
        const sb = await getJSON(variants[i]);
        const events = sb?.events || [];
        if (!events.length) continue;

        const out = events.reduce((acc, ev) => {
          const comps = ev?.competitions?.[0]?.competitors || [];
          if (comps.length !== 2) return acc;

          const t1 = comps[0]?.team?.displayName || comps[0]?.team?.name || "";
          const t2 = comps[1]?.team?.displayName || comps[1]?.team?.name || "";
          
          if (isWccTeam(t1) && isWccTeam(t2)) {
            const isPac = TEAM_NAME_MATCH.test(t1) || TEAM_NAME_MATCH.test(t2);
            acc.push({
              id: ev.id, status: ev?.status?.type?.state || "pre",
              teams: [ { name: t1, score: parseInt(comps[0]?.score, 10) }, { name: t2, score: parseInt(comps[1]?.score, 10) } ],
              isPacific: isPac,
              opponent: isPac ? (TEAM_NAME_MATCH.test(t1) ? (comps[1]?.team?.abbreviation || t2) : (comps[0]?.team?.abbreviation || t1)) : null
            });
          }
          return acc;
        }, []);

        if (out.length) return out;
      } catch(e){ log(`scoreboard ${date} v${i} failed.`); }
    }
    return [];
  }

  function updateBracket(events){
    if (!events.length) return;
    
    DOM.bracketCards.forEach(card => {
      const wanted = card.dataset.teams.toLowerCase().split("|").map(s => s.trim());
      const match = events.find(ev => {
        const have = ev.teams.map(t => t.name.toLowerCase());
        return wanted.every(w => have.some(h => h.includes(w)));
      });
      
      if (!match) return;

      card.dataset.eid = match.id;
      card.style.cursor = "pointer";
      card.onclick = (e) => {
        if (!e.target.closest("a, button, input")) window.open(`https://www.espn.com/college-baseball/game/_/gameId/${match.id}`, "_blank", "noopener");
      };

      const teamRows = Array.from(card.querySelectorAll(".team"));
      if (teamRows.length === 2 && match.status !== "pre"){
        const matchTeam = (rowName) => {
          const n = rowName.toLowerCase().trim().replace(/['']/g,"").replace(/\bst\.?\b/g,"saint");
          return match.teams.find(t => t.name.toLowerCase().replace(/['']/g,"").replace(/\bst\.?\b/g,"saint").includes(n));
        };

        teamRows.forEach(row => {
          const matchedTeam = matchTeam(row.querySelector(".name")?.textContent || "");
          if (matchedTeam && isFinite(matchedTeam.score)){
            const scoreEl = row.querySelector(".score");
            if (scoreEl) { scoreEl.textContent = matchedTeam.score; scoreEl.classList.remove("dim"); }
          }
        });

        if (match.status === "post"){
          card.classList.remove("pending");
          const winTeam = match.teams[0].score > match.teams[1].score ? match.teams[0] : match.teams[1];
          teamRows.forEach(row => {
            const isWinner = matchTeam(row.querySelector(".name")?.textContent || "") === winTeam;
            row.classList.remove("win", "loss", "tbd");
            row.classList.add(isWinner ? "win" : "loss");
          });
        }
      }
    });
  }

  function parseBox(summary, eid){
    try {
      const pacificBlock = summary?.boxscore?.players?.find(p => TEAM_NAME_MATCH.test(p?.team?.displayName||"") || TEAM_NAME_MATCH.test(p?.team?.name||""));
      if (!pacificBlock) return null;

      const batting = pacificBlock.statistics?.find(s => (s.type || s.name || "").toLowerCase().includes("bat"));
      if (!batting) return null;

      const keys = (batting.keys || batting.labels || []).map(k => String(k).toLowerCase());
      const row = batting.athletes?.find(a => PLAYER_NAME_MATCH.test(a?.athlete?.displayName || ""));
      if (!row) return { found: false };

      const num = (aliases) => {
        const i = keys.findIndex(k => aliases.includes(k));
        return i >= 0 ? (parseInt(row.stats[i], 10) || 0) : 0;
      };

      const ab = num(["ab","atbats"]), h = num(["h","hits"]), d2 = num(["2b","doubles"]), d3 = num(["3b","triples"]), hr = num(["hr","homeruns"]);
      return {
        found: true, ab, h, r: num(["r","runs"]), rbi: num(["rbi","rbis"]), hr, 
        bb: num(["bb","walks"]), hbp: num(["hbp"]), sf: num(["sf","sacflies","sacrificeflies"]),
        tb: Math.max(0, h - d2 - d3 - hr) + 2*d2 + 3*d3 + 4*hr
      };
    } catch(e){ log(`parseBox ${eid} threw: ${e.message}`); return null; }
  }

  async function tick(){
    let anyLive = false, updates = 0;
    try {
      // Execute date fetches concurrently
      const allWccEvents = (await Promise.all(TOURNAMENT_DATES.map(d => findWccEventsForDate(d)))).flat();
      updateBracket(allWccEvents);

      const allEvents = allWccEvents.filter(e => e.isPacific);
      const anyWccLive = allWccEvents.some(e => e.status === "in");

      for (const ev of allEvents){
        if (ev.status === "pre") continue;
        if (ev.status === "in") anyLive = true;

        const existing = games[ev.id];
        // Short-circuit: if game is final and already cached, skip network fetch entirely.
        if (ev.status === "post" && existing && existing.status === "post") continue;

        try {
          const summary = await getJSON(SUMMARY(ev.id));
          const parsed = parseBox(summary, ev.id);
          if (!parsed) continue; 

          const next = parsed.found 
            ? { ...parsed, status: ev.status, opponent: ev.opponent }
            : { ab:0, h:0, r:0, rbi:0, hr:0, bb:0, hbp:0, sf:0, tb:0, status: ev.status, opponent: ev.opponent, dnp: true };

          // Shallow compare to trigger flash
          if (!existing || JSON.stringify({ ...existing, status: undefined }) !== JSON.stringify({ ...next, status: undefined })) {
            games[ev.id] = next;
            updates++;
          }
        } catch(e){ log(`summary ${ev.id} failed.`); }
      }

      if (updates > 0) {
        await saveGames();
        render();
        DOM.statCards.forEach(s => { s.classList.remove("flash"); void s.offsetWidth; s.classList.add("flash"); });
      }

      if (DOM.liveDot) DOM.liveDot.hidden = !anyLive;
      const t = new Date().toLocaleTimeString([], { hour: "numeric", minute: "2-digit" });
      setSync(allEvents.length === 0 ? `no Pacific games found · ${t}` : (anyLive ? `live · synced ${t}` : `synced ${t}`), "ok");

      setTimeout(tick, anyWccLive ? POLL_LIVE_MS : POLL_IDLE_MS);

    } catch(e) {
      setSync("sync error — will retry", "err");
      setTimeout(tick, POLL_IDLE_MS);
    }
  }

  function wireManualEntry(){
    if (!DOM.manual.save) return;
    const getN = (input) => Math.max(0, parseInt(input.value, 10) || 0);
    
    DOM.manual.save.addEventListener("click", async () => {
      const opp = (DOM.manual.opp.value || "manual").trim();
      const ab = getN(DOM.manual.ab), h = getN(DOM.manual.h), d2 = getN(DOM.manual.d2), d3 = getN(DOM.manual.d3), hr = getN(DOM.manual.hr);
      
      games["manual-" + Date.now()] = {
        ab, h, r: getN(DOM.manual.r), rbi: getN(DOM.manual.rbi), hr, bb: getN(DOM.manual.bb), hbp: getN(DOM.manual.hbp), sf: getN(DOM.manual.sf),
        tb: Math.max(0, h - d2 - d3 - hr) + 2*d2 + 3*d3 + 4*hr, status: "post", opponent: opp, manual: true 
      };
      
      await saveGames();
      render();
      DOM.statCards.forEach(s => { s.classList.remove("flash"); void s.offsetWidth; s.classList.add("flash"); });
      Object.values(DOM.manual).forEach(el => { if(el.tagName === 'INPUT') el.value = el.type === "text" ? "" : "0"; });
    });

    DOM.manual.clear.addEventListener("click", async () => {
      if (!confirm("Wipe all stored game stats?")) return;
      games = {};
      await saveGames();
      render();
    });

    DOM.manual.resync.addEventListener("click", tick);
  }

  document.addEventListener("DOMContentLoaded", async () => {
    wireManualEntry();
    await loadGames();
    render();
    setSync("connecting…", "");
    tick();
  });
})();
</script>
